#
# Crowdin CLI configuration (run from .gitlab/ci/crowdin.yml).
#
# Only the English texts (app/src/main/res/values/) live in this repo. Translations are downloaded
# into app/src/main/res/values-<code>/ before each release, the app counts every folder it finds
# there as a supported language (see app/build.gradle.kts).
#
# Credentials come from the environment, never from this file:
#   CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN
#

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
base_url: "https://api.crowdin.com"

preserve_hierarchy: true

files:
  - source: /app/src/main/res/values/*.strings.xml
    translation: /app/src/main/res/values-%android_code%/%original_file_name%
    # Untranslated texts are left out, Android shows the English ones in their place
    skip_untranslated_strings: true
  - source: /app/src/main/res/values/plurals.xml
    translation: /app/src/main/res/values-%android_code%/plurals.xml
    skip_untranslated_strings: true
  # Store listing (F-Droid reads fastlane/metadata/android/<locale>/), a missing file falls back to
  # en-US. The title stays "Kreate" everywhere, like app_name
  - source: /fastlane/metadata/android/en-US/full_description.txt
    translation: /fastlane/metadata/android/%locale%/%original_file_name%
    # Its HTML tags stay out of the translators' texts
    type: html
  - source: /fastlane/metadata/android/en-US/short_description.txt
    translation: /fastlane/metadata/android/%locale%/%original_file_name%
