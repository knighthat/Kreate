# Pulls the translations of the branch the run starts from (BRANCH) into BRANCH_l10n, without a
# pull request: one commit on top of that branch as it is on GitHub (made from BRANCH the first
# time). The runner's copy of the repository is only where that commit is made, it's gone after the
# run. Sources reach Crowdin through its GitHub integration, this only downloads.
#
# A scheduled run always starts from the default branch; pick another one in Run workflow.
#
# Needs the repository secrets CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN (crowdin.yml reads
# them from the environment). Scheduled runs and the Run workflow button only exist once this file
# is on the default branch.

name: Crowdin translations

on:
  schedule:
    # At 03:00 UTC on Saturday
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The branch the run started from, the Crowdin integration names its Crowdin branch the same
  BRANCH: ${{ github.ref_name }}

# A second run while Crowdin still builds the first one's export would fail with 409
concurrency:
  group: crowdin-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      # Holds crowdin.yml, and is the start of BRANCH_l10n the first time
      - uses: actions/checkout@v7

      - name: Download translations
        uses: crowdin/github-action@v3
        with:
          # The integration uploads, so nothing goes up from here
          upload_sources: false
          upload_translations: false
          download_translations: true
          # The integration keeps the files under the Crowdin branch named after the git one
          crowdin_branch_name: ${{ env.BRANCH }}

          localization_branch_name: ${{ env.BRANCH }}_l10n
          push_translations: true
          commit_message: 'update translations from crowdin'
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
