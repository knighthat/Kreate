# Releases the Crowdin distribution the patreon build reads its languages from, when its
# translations changed. Patreon shows only these texts (its APK has English only), so an outdated
# release keeps it on older ones.
#
# release-translations: run by a pipeline schedule with the variable CROWDIN_ACTION = release
#                       (Build > Pipeline schedules, a schedule of its own next to crowdin.yml's
#                       download one), or by hand: Build > Pipelines > New pipeline with the same
#                       variable. It exports the distribution's bundle and releases only when the
#                       export differs from the one last released, whose checksum the job's cache
#                       keeps; a cache that was cleared counts as changed.
#
# Each release makes the distribution's manifest newer, so every patreon install downloads its
# language again at its next check (at most every 48 h, see TranslationUpdates in app/src/patreon):
# releasing without a change would cost every install requests for nothing. The export goes through
# the Crowdin API, not the CDN, so checking costs no CDN requests.
#
# Needs the CI/CD variables of crowdin.yml (CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN) and
# CROWDIN_DISTRIBUTION_HASH, the same one release.yml builds with. Protected variables reach only
# protected refs, so the branch the schedule runs on must be protected (or the variables not
# protected).

release-translations:
  extends: .crowdin
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CROWDIN_ACTION == "release"
    - if: $CI_PIPELINE_SOURCE == "web" && $CROWDIN_ACTION == "release"
  variables:
    # "Android app texts", the bundle the distribution is made of
    CROWDIN_BUNDLE_ID: "6"
  # Only the checksum of the last release; one for every branch, there is one distribution
  cache:
    key: crowdin-release
    paths:
      - .crowdin-release/
    policy: pull-push
  script:
    - |
      if [ -z "$CROWDIN_DISTRIBUTION_HASH" ]; then
        echo "CROWDIN_DISTRIBUTION_HASH is not set (is this branch protected?)"
        exit 1
      fi
    # The export lands in a folder of its own, not over the repository's translations
    - export EXPORT_DIR="$(mktemp -d)"
    - crowdin bundle download "$CROWDIN_BUNDLE_ID" --base-path "$EXPORT_DIR" --no-progress
    - |
      FILES=$(cd "$EXPORT_DIR" && find . -type f -name '*.xml' | sort)
      if [ -z "$FILES" ]; then
        echo "The bundle export holds no XML files:"
        find "$EXPORT_DIR"
        exit 1
      fi
      # Each file's path and content, so a language added or gone counts too
      CHECKSUM=$(cd "$EXPORT_DIR" && echo "$FILES" | xargs sha256sum | sha256sum | cut -d' ' -f1)
      mkdir -p .crowdin-release
      if [ "$CHECKSUM" = "$(cat .crowdin-release/checksum 2>/dev/null)" ]; then
        echo "Translations unchanged since the last release ($CHECKSUM), nothing to release"
        exit 0
      fi
      crowdin distribution release "$CROWDIN_DISTRIBUTION_HASH" --no-progress
      echo "$CHECKSUM" > .crowdin-release/checksum
      echo "Released, translations now $CHECKSUM"
