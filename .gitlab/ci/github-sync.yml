# Copies a release to GitHub: creating a release on GitLab creates its tag, and the tag's snapshot
# is pushed to GitHub with it. GitHub only hears from GitLab through this job.
#
# The tag goes up as it is. The branch the release was cut from (looked up, a tag doesn't record
# it) is moved to the tagged commit only when that is a plain fast-forward on GitHub; a release
# cut from a commit that isn't ahead of it fails the job instead of rewriting GitHub's history.
#
# Needs the CI/CD variable GITHUB_DEPLOY_KEY (type File, the private half of a deploy key with write
# access; the public half is added in the GitHub repository's Settings > Deploy keys).

github-sync:
  image: alpine:3
  variables:
    GITHUB_REPO: git@github.com:knighthat/Kreate.git
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apk add --no-cache git openssh-client
    - install -m 600 "$GITHUB_DEPLOY_KEY" /tmp/github_key
    - export GIT_SSH_COMMAND="ssh -i /tmp/github_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
    - git remote add github "$GITHUB_REPO"
    # A tag knows no branch, so the branch is looked up: the one whose tip is the tagged commit, else
    # the only one containing it, else the default branch when it contains it. *_l10n is Crowdin's
    - git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
    - |
      BRANCHES=$(git branch -r --contains "$CI_COMMIT_SHA" --format='%(refname:lstrip=3)' | grep -v '_l10n$' || true)
      BRANCH=$(echo "$BRANCHES" | while read -r b; do
        [ -n "$b" ] && [ "$(git rev-parse "origin/$b")" = "$CI_COMMIT_SHA" ] && echo "$b" && break
      done)
      if [ -z "$BRANCH" ] && [ "$(echo "$BRANCHES" | grep -c .)" = 1 ]; then BRANCH="$BRANCHES"; fi
      if [ -z "$BRANCH" ] && echo "$BRANCHES" | grep -qx "$CI_DEFAULT_BRANCH"; then BRANCH="$CI_DEFAULT_BRANCH"; fi
      if [ -z "$BRANCH" ]; then echo "No branch to follow for $CI_COMMIT_TAG, found: $BRANCHES"; exit 1; fi
      echo "Releasing $CI_COMMIT_TAG on $BRANCH"
      git push github "${CI_COMMIT_SHA}:refs/heads/${BRANCH}"
    - git push github "refs/tags/${CI_COMMIT_TAG}"
